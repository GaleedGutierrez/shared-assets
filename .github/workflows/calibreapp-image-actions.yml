---
name: 🖼️ Compress Images
on:
  pull_request:
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: 👍 Checkout Repo
        uses: actions/checkout@v4

      - name: 🗜️ Compress Images
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Screenshots are full-quality PNG sources: the consumer's image
          # pipeline derives every format from them, so they must not be
          # palette-quantized here.
          ignorePaths: "node_modules/**,src/assets/images/screenshot-*/**"
