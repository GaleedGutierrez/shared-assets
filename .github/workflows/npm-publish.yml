---
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # publint + attw: fail before publishing a broken export.
      - run: npm run check-package
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          # Signed build attestation, linked to this workflow run.
          provenance: true
