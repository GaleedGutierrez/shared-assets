---
on:
  push:
    branches: [main]
permissions:
  contents: read
  # Trusted publishing: npm exchanges this OIDC token for a short-lived
  # publish token, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10; trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # publint + attw: fail before publishing a broken export.
      - run: npm run check-package
      # `npm publish` fails on an existing version, so only publish when
      # package.json has a version the registry doesn't have yet.
      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm, skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Provenance is attached automatically with trusted publishing.
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
