---
name: ⚡🧪 Vitest Test
on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}

jobs:
  test:
    name: ⚡🧪 Vitest Test
    runs-on: ubuntu-latest
    steps:
      - name: 👍 Checkout code
        uses: actions/checkout@v4.2.2

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 📥 Install Dependencies
        run: npm ci

      - name: ⚡ Vitest
        run: npm test
